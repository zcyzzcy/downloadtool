plugins {
    id 'com.android.application'
}

android {
    namespace 'com.palworld.vd'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.palworld.vd"
        minSdk 24
        targetSdk 34
        versionCode 44
        versionName "1.42"
        // 只保留 arm64：近 8 年的手机全是 64 位，省掉整份 32 位引擎约 47MB
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false   // res/raw/ytdlp 由库在运行时按资源名加载，不能收缩
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Python/yt-dlp/ffmpeg 的 .so 必须解压到文件系统（配合 manifest android:extractNativeLibs="true"）
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
        // 本机调试 daemon 会在 assets 里留 __pycache__（.gitignore 拦得住 git，拦不住打包）
        resources { excludes += ['assets/__pycache__/*', 'META-INF/*.kotlin_module'] }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.0'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.0'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.0'
    // 播放器内核：Media3 ExoPlayer（B站等主流播放器同源方案）。MediaPlayer 在部分 ROM 上
    // 会误报"解码失败"、seek 不精准、不支持 mkv/ts——ExoPlayer 一次解决这三个问题
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // FileProvider：下载的文件授权给系统播放器打开
    implementation 'androidx.core:core:1.13.1'
    // androidx.core 的 kotlin-stdlib 1.8 与库里的 stdlib-jdk7/8 1.7 撞类：
    // 1.8 起 jdk7/jdk8 已并入主包（这两个坐标只剩空壳），统一到 1.8.22 消除重复
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') { because 'kotlin-stdlib 1.8 merged jdk7' }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') { because 'kotlin-stdlib 1.8 merged jdk8' }
    }
}
