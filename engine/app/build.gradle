plugins {
    id 'com.android.application'
}

android {
    namespace 'com.palworld.vd'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.palworld.vd"
        minSdk 24
        targetSdk 34
        versionCode 181
        versionName "1.73"
        // ??? arm64?? 8 ?????? 64 ?????? 32 ???? 47MB
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled true
            // v1.99???????????? res/raw/ytdlp ???????res/raw/keep.xml
            // ??????????????? ytdlp zipapp????????????
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Python/yt-dlp/ffmpeg ? .so ???????????? manifest android:extractNativeLibs="true"?
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
        // ???? daemon ?? assets ?? __pycache__?.gitignore ??? git???????
        resources { excludes += ['assets/__pycache__/*', 'META-INF/*.kotlin_module'] }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.0'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.0'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.0'
    // ??????Media3 ExoPlayer?B?????????????MediaPlayer ??? ROM ?
    // ???"????"?seek ??????? mkv/ts??ExoPlayer ?????????
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // FileProvider????????????????
    implementation 'androidx.core:core:1.13.1'
    // v1.65 ????????
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // androidx.core ? kotlin-stdlib 1.8 ???? stdlib-jdk7/8 1.7 ???
    // 1.8 ? jdk7/jdk8 ???????????????????? 1.8.22 ????
    constraints {
        implementation('androidx.appcompat:appcompat:1.6.1') { because 'Keep the existing AndroidX runtime after removing barcode scanning' }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') { because 'kotlin-stdlib 1.8 merged jdk7' }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') { because 'kotlin-stdlib 1.8 merged jdk8' }
    }
    // v1.12 ???????? segmentation-selfie / face-detection ?? bundled ???????APK ??????
    // v2.04 ?????????bundled?+ ??????? Java?
    // v1.5 ??????????????SAF ??????DocumentFile?
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
